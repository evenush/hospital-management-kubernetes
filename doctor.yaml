apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: doctor-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: doctor-service
  template:
    metadata:
      labels:
        app: doctor-service
    spec:
      containers:
        - name: doctor-container
          image: hospital-doctor-service:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: APP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hospital-app-secrets
                  key: APP_SECRET_KEY
          volumeMounts:
            - name: doctor-storage
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: doctor-storage
          persistentVolumeClaim:
            claimName: doctor-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: doctor-service
spec:
  type: ClusterIP
  selector:
    app: doctor-service
  ports:
    - port: 8002
      targetPort: 8002
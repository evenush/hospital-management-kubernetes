apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: appointment-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: appointment-service
  template:
    metadata:
      labels:
        app: appointment-service
    spec:
      containers:
        - name: appointment-container
          image: hospital-appointment-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          env:
            - name: APP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hospital-app-secrets
                  key: APP_SECRET_KEY
          volumeMounts:
            - name: appointment-storage
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: appointment-storage
          persistentVolumeClaim:
            claimName: appointment-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: appointment-service
spec:
  type: ClusterIP
  selector:
    app: appointment-service
  ports:
    - port: 8003
      targetPort: 8003
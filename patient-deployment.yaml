apiVersion: apps/v1
kind: Deployment

metadata:
  name: patient-service
  namespace: hospital-system

spec:
  replicas: 2

  selector:
    matchLabels:
      app: patient-service

  template:
    metadata:
      labels:
        app: patient-service

    spec:
      containers:
      - name: patient-service

        image: hospital-patient-service:1.0

        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8001